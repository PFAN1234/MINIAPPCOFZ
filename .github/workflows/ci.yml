name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: App (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Imagem oficial com o Chromium e as dependências do sistema já instalados
    # (mesma versão do @playwright/test do app/package.json). Evita o apt do runner,
    # que vinha falhando ao resolver archive.ubuntu.com.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:e2e
      # Testes do gerador do boletim que abrem o Chromium (no job `app` eles são pulados).
      - run: npx vitest run servidor
        env:
          BOLETIM_EXIGIR_CHROMIUM: '1'

  python:
    name: Python (scripts e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            scripts/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --ignore=tests/db


  funcoes:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check */*.ts
      - run: deno test

  banco:
    name: Banco (migrations, RLS e RPCs)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest "psycopg[binary]>=3.1"
      - run: pytest -q tests/db

  # TODO: adicionar `supabase db lint` (supabase/setup-cli + `supabase start`)
  # quando houver como subir a pilha local do Supabase no CI.
