name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: App (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    name: Python (scripts e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            scripts/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # TODO (fase 2): quando existirem migrations em supabase/migrations, adicionar um
  # job com `supabase db lint` (supabase/setup-cli + `supabase start` + `supabase db lint`).
